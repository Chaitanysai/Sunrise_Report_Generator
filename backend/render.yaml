services:
  - type: web
    name: control-sheet-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: processed-workbooks
      - key: CORS_ORIGINS
        sync: false
      - key: DOWNLOAD_URL_TTL_SECONDS
        value: "3600"
